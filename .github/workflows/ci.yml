name: ci

on:
    push:
        branches: [main]
    pull_request:

# Least privilege, and stated rather than inherited: this workflow reads the code and writes
# nothing back. Without it the job would get whatever the repository's default token scope is,
# which is broader than checking out and running yarn needs.
permissions:
    contents: read

# A new push supersedes the run in flight, so a series of commits does not queue up behind itself.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  # The version package.json's engines field asks for, and the one the shared packages need.
                  node-version: 24

            # setup-node is pinned to v6 and given no cache setting, matching the other repositories. v5 turns
            # `package-manager-cache` on by default, which sees yarn.lock and runs `yarn cache dir` with the runner's
            # global Yarn 1 before Corepack is enabled, and that fails against a `packageManager` of yarn@4.
            # Removing Yarn 1 outright then lets Corepack take over.
            - name: Remove preinstalled Yarn 1
              run: sudo rm -f /usr/local/bin/yarn /usr/local/bin/yarnpkg || true

            - name: Enable Corepack
              run: corepack enable

            - name: Verify Yarn version
              run: yarn --version

            - run: yarn install --immutable

            # Cheapest first, so an unformatted file does not wait behind the build. Prettier owns the
            # formatting.
            - run: yarn format:check

            # Next cheapest, and the only step that reads what the code means rather than how it is
            # written. Its job here is the hook dependency lists: every one that leaves something out
            # does so on purpose, and this is what keeps the purpose stated rather than assumed.
            - run: yarn lint

            - run: yarn typecheck

            - run: yarn test

            - run: yarn build
