name: ci

on:
    push:
        branches: [main]
    pull_request:

# Least privilege, and stated rather than inherited: this workflow reads the code and writes
# nothing back. Without it the job would get whatever the repository's default token scope is,
# which is broader than checking out and running yarn needs.
permissions:
    contents: read

# A new push supersedes the run in flight, so a series of commits does not queue up behind itself.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # The test scripts pass `src/**/*.test.ts` and, in web, `.test.tsx` to node --test and let node
                  # expand them, which needs Node 22 or later. The shell leaves them alone, having nothing to match.
                  node-version: 24

            # Completely remove Yarn 1 so Corepack takes over. `cache: yarn` on setup-node is deliberately not used:
            # it runs before Corepack, so it would read a Yarn 4 lockfile with the runner's preinstalled Yarn 1.
            - name: Remove preinstalled Yarn 1
              run: sudo rm -f /usr/local/bin/yarn /usr/local/bin/yarnpkg || true

            - name: Enable Corepack
              run: corepack enable

            - name: Verify Yarn version
              run: yarn --version

            - run: yarn install --immutable

            # Cheapest first, so an unformatted file does not wait behind the build. Prettier owns the
            # formatting, and appCatalogue.ts is generated, which is the file that tends to drift.
            - run: yarn format:check

            # Next cheapest, and the only step that reads what the code means rather than how it is
            # written. Its job here is the hook dependency lists: every one that leaves something out
            # does so on purpose, and this is what keeps the purpose stated rather than assumed.
            - run: yarn lint

            - run: yarn typecheck

            - run: yarn test

            - run: yarn build
